name: Windows Clean VM GUI Screen Recording (Temp Staging)

on:
  workflow_dispatch:
    inputs:
      staging_tag:
        description: "Staging draft release tag_name containing ValidTeam-windows-amd64.zip"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-gui-record:
    name: "Windows x64 Real GUI Walkthrough & MP4 Recording"
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout Public Verification Harness (Zero App Source)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 2. Download Windows Staging Package & Verify SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.staging_tag }}
        run: |
          set -euo pipefail
          mkdir -p staging-win && cd staging-win
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30")"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; tag=sys.argv[1]; rs=json.load(sys.stdin); print(next((str(r["id"]) for r in rs if r.get("tag_name")==tag), ""))' "$TARGET_TAG")"
          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: release with tag_name=$TARGET_TAG not found"
            exit 1
          fi
          ASSETS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets")"
          for NAME in ValidTeam-windows-amd64.zip SHA256SUMS-windows.txt; do
            ASSET_ID="$(printf '%s' "$ASSETS_JSON" | python3 -c 'import json,sys; n=sys.argv[1]; xs=json.load(sys.stdin); print(next((str(a["id"]) for a in xs if a.get("name")==n), ""))' "$NAME")"
            if [ -z "$ASSET_ID" ]; then
              echo "ERROR: asset $NAME not found in release $RELEASE_ID"
              exit 1
            fi
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
              -o "$NAME"
          done
          sha256sum -c SHA256SUMS-windows.txt
          ls -lh ValidTeam-windows-amd64.zip SHA256SUMS-windows.txt

      - name: 3. Install ffmpeg (if missing) & Check Interactive Desktop Session
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "Installing ffmpeg via choco..."
            & choco install ffmpeg -y --no-progress | Out-Null
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          }
          & ffmpeg -version | Select-Object -First 2
          & ffprobe -version | Select-Object -First 2
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object ProcessName, SessionId, Id

      - name: 4. Run ValidTeam.exe Real Desktop GUI Walkthrough & Record MP4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $outDir = Join-Path $env:RUNNER_TEMP "gui-recording-out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          pwsh -File scripts/windows_gui_record.ps1 -ZipPath ".\staging-win\ValidTeam-windows-amd64.zip" -OutDir $outDir

      - name: 5. Upload Recorded MP4 & Keyframe Previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ValidTeam-Windows-GUI-Recording
          retention-days: 1
          path: ${{ runner.temp }}/gui-recording-out/
