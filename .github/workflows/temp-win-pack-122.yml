name: Temporary Windows Installer Pack (v1.2.2)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download zero-source binaries and build Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $OutputEncoding = [Console]::InputEncoding = [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $work = Join-Path $env:RUNNER_TEMP "winpack"
          $outDir = Join-Path $env:RUNNER_TEMP "winout"
          New-Item -ItemType Directory -Force -Path $work, $outDir | Out-Null

          $assetId = (gh api "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == true and .name == "Temporary Windows Pack (v1.2.2)") | .assets[0].id' | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($assetId)) { throw "Draft asset not found" }
          $tgz = Join-Path $work "win-pack-input.tar.gz"
          & curl.exe -fSL -H "Authorization: Bearer $($env:GH_TOKEN)" -H "Accept: application/octet-stream" "https://api.github.com/repos/$env:GITHUB_REPOSITORY/assets/$assetId" -o $tgz 2>$null
          if ($LASTEXITCODE -ne 0) {
            & curl.exe -fSL -H "Authorization: Bearer $($env:GH_TOKEN)" -H "Accept: application/octet-stream" "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$assetId" -o $tgz
            if ($LASTEXITCODE -ne 0) { throw "curl failed: $LASTEXITCODE" }
          }
          tar -xzf $tgz -C $work

          $appVer = "1.2.2"
          $buildNum = (Get-Content -LiteralPath (Join-Path $work "build_num.txt") -Raw).Trim()
          $notesText = (Get-Content -LiteralPath (Join-Path $work "notes_1.2.2_ota.md") -Raw).Trim()
          $stageDir = Join-Path $work "ValidTeam"
          $winresDir = Join-Path $work "winres"

          $zipPath = Join-Path $outDir "ValidTeam-windows-amd64.zip"
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force

          $isccPath = $null
          foreach ($cand in @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe",
            "C:\ProgramData\chocolatey\bin\ISCC.exe"
          )) {
            if ($cand -and (Test-Path -LiteralPath $cand)) { $isccPath = $cand; break }
          }
          if (-not $isccPath) {
            choco install innosetup -y --no-progress | Out-Null
            foreach ($cand in @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\ISCC.exe"
            )) {
              if ($cand -and (Test-Path -LiteralPath $cand)) { $isccPath = $cand; break }
            }
          }
          if (-not $isccPath) { throw "ISCC.exe not found" }

          & $isccPath "/DMyAppVersion=$appVer" "/DMyBuildNumber=$buildNum" "/DSourceDir=$stageDir" "/DOutputDir=$outDir" (Join-Path $winresDir "installer.iss")
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

          $setupPath = Join-Path $outDir "ValidTeam-Setup.exe"
          if (-not (Test-Path -LiteralPath $setupPath)) { throw "Missing ValidTeam-Setup.exe" }

          $setupHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item -LiteralPath $setupPath).Length
          $zipSize = (Get-Item -LiteralPath $zipPath).Length

          $sums = "$setupHash  ValidTeam-Setup.exe`n$zipHash  ValidTeam-windows-amd64.zip`n"
          [System.IO.File]::WriteAllText((Join-Path $outDir "SHA256SUMS-windows.txt"), $sums, [System.Text.UTF8Encoding]::new($false))

          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifestObj = [ordered]@{
            version      = $appVer
            build        = $buildNum
            tag          = "v$appVer"
            pub_date     = $pubDate
            published_at = $pubDate
            zip_name     = "ValidTeam-windows-amd64.zip"
            zip_url      = "https://github.com/valid-studio/valid-team-releases/releases/download/v$appVer/ValidTeam-windows-amd64.zip"
            zip_sha256   = $zipHash
            zip_size     = [int64]$zipSize
            setup_name   = "ValidTeam-Setup.exe"
            setup_url    = "https://github.com/valid-studio/valid-team-releases/releases/download/v$appVer/ValidTeam-Setup.exe"
            setup_sha256 = $setupHash
            setup_size   = [int64]$setupSize
            sha256       = $zipHash
            notes        = $notesText
          }
          [System.IO.File]::WriteAllText((Join-Path $outDir "latest-windows.json"), (($manifestObj | ConvertTo-Json -Depth 4) + "`n"), [System.Text.UTF8Encoding]::new($false))

          # Smoke verify ValidTeam.exe --ci-selftest & --version
          $env:VALID_TEAM_SECRET_BACKEND = "memory"
          $guiExe = Join-Path $stageDir "ValidTeam.exe"
          $vOut = & $guiExe --version | Out-String
          Write-Host "Version check: $vOut"
          if ($vOut -notmatch "1\.2\.2") { throw "Unexpected version output: $vOut" }
          $stOut = & $guiExe --ci-selftest | Out-String
          Write-Host "CI selftest: $stOut"
          if ($LASTEXITCODE -ne 0 -or $stOut -notmatch "WIN_GUI_SELFTEST_OK") { throw "ci-selftest failed" }

          # Smoke verify OTA selftest against local manifest server
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ($listener.LocalEndpoint).Port
          $listener.Stop()
          $srvDir = Join-Path $env:RUNNER_TEMP "winotasrv"
          New-Item -ItemType Directory -Force -Path $srvDir | Out-Null
          Copy-Item $zipPath (Join-Path $srvDir "ValidTeam-windows-amd64.zip") -Force
          Copy-Item $setupPath (Join-Path $srvDir "ValidTeam-Setup.exe") -Force
          $mLocal = $manifestObj | ConvertTo-Json -Depth 4 | ConvertFrom-Json
          $mLocal.zip_url = "http://127.0.0.1:$port/ValidTeam-windows-amd64.zip"
          $mLocal.setup_url = "http://127.0.0.1:$port/ValidTeam-Setup.exe"
          [System.IO.File]::WriteAllText((Join-Path $srvDir "latest-windows.json"), (($mLocal | ConvertTo-Json -Depth 4) + "`n"), [System.Text.UTF8Encoding]::new($false))
          $psi = [System.Diagnostics.ProcessStartInfo]::new("python", "-m http.server $port --bind 127.0.0.1")
          $psi.WorkingDirectory = $srvDir
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $http = [System.Diagnostics.Process]::Start($psi)
          try {
            Start-Sleep -Seconds 2
            $oldZip = Join-Path $env:RUNNER_TEMP "v121.zip"
            $oldDir = Join-Path $env:RUNNER_TEMP "v121_unpacked"
            & curl.exe -fSL "https://github.com/valid-studio/valid-team-releases/releases/download/v1.2.1/ValidTeam-windows-amd64.zip" -o $oldZip
            if ($LASTEXITCODE -ne 0) { throw "download v1.2.1 failed" }
            Expand-Archive -LiteralPath $oldZip -DestinationPath $oldDir -Force
            $oldGuiExe = (Get-ChildItem -Path $oldDir -Filter "ValidTeam.exe" -Recurse | Select-Object -First 1).FullName
            if (-not $oldGuiExe) { throw "v1.2.1 ValidTeam.exe missing" }
            $env:VTEAM_WIN_OTA_MANIFEST_URL = "http://127.0.0.1:$port/latest-windows.json"
            $env:VTEAM_WIN_OTA_CACHE_DIR = (Join-Path $env:RUNNER_TEMP "winotacache")
            $otaOut = & $oldGuiExe --verify-ota-selftest | Out-String
            Write-Host "OTA selftest: $otaOut"
            if ($LASTEXITCODE -ne 0 -or $otaOut -notmatch "WIN_OTA_SELFTEST_OK") { throw "ota-selftest failed" }
          } finally {
            if ($http -and -not $http.HasExited) { Stop-Process -Id $http.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-assets
          retention-days: 1
          path: |
            ${{ runner.temp }}\winout\ValidTeam-Setup.exe
            ${{ runner.temp }}\winout\ValidTeam-windows-amd64.zip
            ${{ runner.temp }}\winout\SHA256SUMS-windows.txt
            ${{ runner.temp }}\winout\latest-windows.json
