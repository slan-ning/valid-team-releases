name: Build Windows Inno Setup Installer (Temp)

on:
  workflow_dispatch:
    inputs:
      staging_tag:
        required: true
        type: string
      app_version:
        required: true
        type: string
      build_number:
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-setup:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download staging assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.staging_tag }}
        run: |
          set -euo pipefail
          mkdir -p stage && cd stage
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30")"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; tag=sys.argv[1]; rs=json.load(sys.stdin); print(next((str(r["id"]) for r in rs if r.get("tag_name")==tag), ""))' "$TARGET_TAG")"
          ASSETS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets")"
          for NAME in ValidTeam-windows-amd64.zip installer.iss app.ico; do
            ASSET_ID="$(printf '%s' "$ASSETS_JSON" | python3 -c 'import json,sys; n=sys.argv[1]; xs=json.load(sys.stdin); print(next((str(a["id"]) for a in xs if a.get("name")==n), ""))' "$NAME")"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
              -o "$NAME"
          done
          ls -lh

      - name: Run Inno Setup (ISCC.exe) & Compute SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $work = Join-Path $PWD "stage"
          $outDir = Join-Path $env:RUNNER_TEMP "win-out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Expand-Archive -LiteralPath (Join-Path $work "ValidTeam-windows-amd64.zip") -DestinationPath $work -Force
          $sourceDir = Join-Path $work "ValidTeam"
          Copy-Item -LiteralPath (Join-Path $work "ValidTeam-windows-amd64.zip") -Destination (Join-Path $outDir "ValidTeam-windows-amd64.zip") -Force

          $iscc = $null
          foreach ($cand in @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "C:\ProgramData\chocolatey\bin\ISCC.exe"
          )) {
            if (Test-Path -LiteralPath $cand) { $iscc = $cand; break }
          }
          if (-not $iscc) {
            & choco install innosetup -y --no-progress | Out-Null
            foreach ($cand in @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\ISCC.exe"
            )) {
              if (Test-Path -LiteralPath $cand) { $iscc = $cand; break }
            }
          }
          if (-not $iscc) { throw "ISCC.exe not found" }

          & $iscc "/DMyAppVersion=${{ inputs.app_version }}" "/DMyBuildNumber=${{ inputs.build_number }}" "/DSourceDir=$sourceDir" "/DOutputDir=$outDir" (Join-Path $work "installer.iss")
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

          $setupPath = Join-Path $outDir "ValidTeam-Setup.exe"
          $zipPath = Join-Path $outDir "ValidTeam-windows-amd64.zip"
          $setupHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = "$setupHash  ValidTeam-Setup.exe`n$zipHash  ValidTeam-windows-amd64.zip`n"
          [System.IO.File]::WriteAllText((Join-Path $outDir "SHA256SUMS-windows.txt"), $sums, [System.Text.UTF8Encoding]::new($false))
          Get-ChildItem -LiteralPath $outDir | Format-Table Name, Length -AutoSize
          Get-Content -LiteralPath (Join-Path $outDir "SHA256SUMS-windows.txt")

      - name: Upload Windows Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: ValidTeam-Windows-Setup-Bundle
          retention-days: 1
          path: ${{ runner.temp }}/win-out/
