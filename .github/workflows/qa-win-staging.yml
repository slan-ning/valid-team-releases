name: Temporary Windows Staging QA (v1.2.1 278701f)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-qa:
    name: "Windows x64 Zero-Source E2E & WIN-OTA-01 (278701f)"
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 1. Download zero-source staging bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "qa_stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $assetId = (gh api "repos/valid-studio/valid-team-releases/releases" --jq '.[] | select(.draft == true and .name == "Temporary QA Windows Staging (v1.2.1 278701f)") | .assets[0].id' | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($assetId)) { throw "Draft staging release asset not found" }
          $tgz = Join-Path $stage "staging.tar.gz"
          & curl.exe -fSL -H "Authorization: Bearer $($env:GH_TOKEN)" -H "Accept: application/octet-stream" "https://api.github.com/repos/valid-studio/valid-team-releases/releases/assets/$assetId" -o $tgz
          if ($LASTEXITCODE -ne 0) { throw "curl download failed: $LASTEXITCODE" }
          tar -xzf $tgz -C $stage

      - name: 2. Run native Windows Go unit tests (windows, store, web)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $OutputEncoding = [Console]::InputEncoding = [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:VALID_TEAM_SECRET_BACKEND = "memory"

          $vtDataDir = Join-Path $env:LOCALAPPDATA "ValidTeam"
          $legacyDir = Join-Path $env:USERPROFILE ".local\share\valid-team"
          New-Item -ItemType Directory -Force -Path $vtDataDir, $legacyDir | Out-Null
          $secToml = @(
            'default_model = "opencode-go/deepseek-v4.1-flash"'
            ''
            '[[api]]'
            'name = "opencode-go"'
            'format = "openai"'
            'base_url = "https://opencode.ai/inference/go/openai/v1"'
            'key = "sk-ci-unit-test-placeholder"'
            'models = ["deepseek-v4.1-flash"]'
          ) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path $vtDataDir "security.toml"), $secToml, [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Join-Path $legacyDir "security.toml"), $secToml, [System.Text.UTF8Encoding]::new($false))

          $stage = Join-Path $env:RUNNER_TEMP "qa_stage"
          Push-Location (Join-Path $stage "windows")
          try {
            Write-Host "==> Running windows.test.exe ..."
            & (Join-Path $stage "tests\windows.test.exe")
            if ($LASTEXITCODE -ne 0) { throw "windows.test.exe failed with $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          Write-Host "==> Running store.test.exe (-test.run=TestWorkspaceRegistry) ..."
          & (Join-Path $stage "tests\store.test.exe") "-test.v" "-test.run=TestWorkspaceRegistry"
          if ($LASTEXITCODE -ne 0) { throw "store.test.exe failed with $LASTEXITCODE" }

          Write-Host "==> Running web.test.exe (-test.run=TestV121[^P]) ..."
          & (Join-Path $stage "tests\web.test.exe") "-test.v" "-test.run=TestV121[^P]"
          if ($LASTEXITCODE -ne 0) { throw "web.test.exe failed with $LASTEXITCODE" }

      - name: 3. Package v1.2.1 Setup & Portable, run ValidTeam.exe --ci-selftest & windows_deep_verify.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $OutputEncoding = [Console]::InputEncoding = [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $stage = Join-Path $env:RUNNER_TEMP "qa_stage"
          & pwsh -File (Join-Path $stage "scripts\build_windows.ps1") -AppVersion "1.2.1" -BuildNumber "20261115.2310" -OutDir (Join-Path $stage "dist\windows")
          if ($LASTEXITCODE -ne 0) { throw "build_windows.ps1 failed" }

          $candGui = Join-Path $stage "prebuilt\v1.2.1\ValidTeam\ValidTeam.exe"
          $candVteam = Join-Path $stage "prebuilt\v1.2.1\ValidTeam\vteam.exe"
          $env:VALID_TEAM_SECRET_BACKEND = "memory"

          $outF = Join-Path $env:RUNNER_TEMP "ci-selftest.out.txt"
          $errF = Join-Path $env:RUNNER_TEMP "ci-selftest.err.txt"
          $p = Start-Process -FilePath $candGui -ArgumentList "--ci-selftest" -Wait -PassThru -RedirectStandardOutput $outF -RedirectStandardError $errF
          $outText = Get-Content -LiteralPath $outF -Raw -ErrorAction SilentlyContinue
          Write-Host $outText
          if ($p.ExitCode -ne 0 -or $outText -notmatch "WIN_GUI_SELFTEST_OK") {
            throw "ValidTeam.exe --ci-selftest failed ($($p.ExitCode))"
          }

          $deepOut = & pwsh -File (Join-Path $stage "scripts\windows_deep_verify.ps1") -VteamExe $candVteam | Out-String
          Write-Host $deepOut
          if ($LASTEXITCODE -ne 0 -or $deepOut -notmatch "WIN_DEEP_VERIFY_OK") {
            throw "windows_deep_verify.ps1 failed ($LASTEXITCODE)"
          }

      - name: 4. Run unmodified windows_ota_e2e_verify.ps1 from 278701f
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $OutputEncoding = [Console]::InputEncoding = [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $stage = Join-Path $env:RUNNER_TEMP "qa_stage"
          $otaOut = & pwsh -File (Join-Path $stage "scripts\windows_ota_e2e_verify.ps1") -DistDir (Join-Path $stage "dist\windows") -TargetVersion "1.2.1" | Out-String
          Write-Host $otaOut
          if ($LASTEXITCODE -ne 0 -or $otaOut -notmatch "WIN_OTA_SELFTEST_OK" -or $otaOut -notmatch "WIN_OTA_E2E_OK") {
            throw "windows_ota_e2e_verify.ps1 failed ($LASTEXITCODE)"
          }
